name: Go

on:
  push:
    branches:
      - "renovate/**"
    paths: &go-paths
      - go.sum
      - go.mod
      - "**.go"
      - ".github/workflows/**"
  pull_request:
    paths: *go-paths

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check out code into the Go module directory
        uses: actions/checkout@v7
      - name: Get dependencies
        run: |
          go get -v -t -d ./...
      - name: Format
        run: |
          go fmt ./...
          git diff --exit-code
      - name: staticcheck
        uses: dominikh/staticcheck-action@v1.4.1
        with:
          install-go: false
      - name: Test
        run: go test -race ./...
